version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: orvyra_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orvyra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orvyrapass}
      POSTGRES_DB: ${POSTGRES_DB:-orvyra_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orvyra} -d ${POSTGRES_DB:-orvyra_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8009:8009"
    environment:
      - ORVYRA_API_KEY=${ORVYRA_API_KEY:-test-secret-key-12345}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DATABASE_URL=${DATABASE_URL:-postgresql://orvyra:orvyrapass@postgres:5432/orvyra_db}
      - PORT=8009
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8009/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - ORVYRA_API_URL=http://backend:8009
      - ORVYRA_API_KEY=${ORVYRA_API_KEY:-test-secret-key-12345}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
