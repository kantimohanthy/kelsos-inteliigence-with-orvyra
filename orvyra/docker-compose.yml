version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8009:8009"
    environment:
      - ORVYRA_API_KEY=${ORVYRA_API_KEY:-test-secret-key-12345}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - PORT=8009
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8009/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - ORVYRA_API_URL=http://backend:8009
      - ORVYRA_API_KEY=${ORVYRA_API_KEY:-test-secret-key-12345}
    depends_on:
      backend:
        condition: service_healthy
